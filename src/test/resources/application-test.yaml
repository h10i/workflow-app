spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  web:
    locale: en_US
rsa:
  private-key: classpath:certs/test-private.pem
  public-key: classpath:certs/test-public.pem